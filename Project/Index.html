<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Interaction Features</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Learning Interaction System</h1>

    <!-- ===== QUIZ FEATURE ===== -->
    <section class="quiz-container">
        <h2>Quick Quiz</h2>

        <form id="quizForm">
            <div class="question-box">
                <p>1. What does HTML stand for?</p>
                <label><input type="radio" name="q1" value="0"> Hyper Trainer Marking Language</label><br>
                <label><input type="radio" name="q1" value="1"> Hyper Text Markup Language</label><br>
                <label><input type="radio" name="q1" value="0"> Hyperlinks Text Mark Language</label>
            </div>

            <div class="question-box">
                <p>2. Which one is a JavaScript data type?</p>
                <label><input type="radio" name="q2" value="1"> Boolean</label><br>
                <label><input type="radio" name="q2" value="0"> Decimal</label><br>
                <label><input type="radio" name="q2" value="0"> Character</label>
            </div>

            <button type="submit" class="btn-submit">Submit Quiz</button>
        </form>

        <p id="quizResult"></p>
    </section>

    <!-- ===== COMMENT SECTION ===== -->
    <section class="comment-section">
        <h2>Lesson Comments</h2>

        <textarea id="commentInput" placeholder="Write your comment..."></textarea>
        <button id="postComment" class="btn-comment">Post</button>

        <div id="commentList"></div>
    </section>

    <!-- Link JS file -->
    <script src="js/script.js"></script>
</body>
</html>
