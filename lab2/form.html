<html>
<head>
    <title>PERSON PROFILE</title>
</head>
<body>
    <form>
        <h1 align="center">PERSON PROFILE</h1> 
        <table border="1" width="60%" align="center">
            <tr>
                <td>Name</td> [cite: 89]
                <td><input type="text" name="name" size="40"></td>
            </tr>
            <tr>
                <td>Email</td> [cite: 90]
                <td><input type="email" name="email" size="40"></td>
            </tr>
            <tr>
                <td>Gender</td> [cite: 91]
                <td>
                    <input type="radio" id="male" name="gender" value="Male"> <label for="male">Male</label> [cite: 95]
                    <input type="radio" id="female" name="gender" value="Female"> <label for="female">Female</label>
                    <input type="radio" id="other" name="gender" value="Other"> <label for="other">Other</label>
                </td>
            </tr>
            <tr>
                <td>Date of Birth</td> [cite: 96]
                <td>
                    <input type="text" name="dob_dd" size="2" maxlength="2"> /
                    <input type="text" name="dob_mm" size="2" maxlength="2"> /
                    <input type="text" name="dob_yyyy" size="4" maxlength="4"> (dd/mm/yyyy) [cite: 97]
                </td>
            </tr>
            <tr>
                <td>Blood Group</td> [cite: 98]
                <td>
                    <select name="blood_group">
                        <option value="a_plus">A+</option> [cite: 99]
                        <option value="b_plus">B+</option>
                        <option value="o_plus">O+</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Degree</td> [cite: 100]
                <td>
                    <input type="checkbox" name="degree_ssc"> SSC. [cite: 102]
                    <input type="checkbox" name="degree_hsc"> HSC.
                    <input type="checkbox" name="degree_bsc"> BSc.
                    <input type="checkbox" name="degree_msc"> MSc.
                </td>
            </tr>
            <tr>
                <td>Photo</td> [cite: 104]
                <td><input type="file" name="photo"></td> [cite: 105]
            </tr>
            <tr>
                <td colspan="2" align="right">
                    <input type="submit" value="Submit"> [cite: 106]
                    <input type="reset" value="Reset"> [cite: 107]
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
