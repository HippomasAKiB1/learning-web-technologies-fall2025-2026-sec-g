<!DOCTYPE html>
<html>
<head>
    <title>Lesson Comments</title>
    <link rel="stylesheet" href="Stylesheet.css">
    <style>
        .lesson-header {
            width: 60%;
            margin: 40px auto 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        .lesson-header h2 {
            color: #000;
        }

        .comment-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .comment-author {
            font-weight: bold;
            color: #000;
        }

        .comment-time {
            font-size: 12px;
            color: #666;
        }

        .delete-btn {
            padding: 5px 10px;
            background: #000;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background: #e74c3c;
        }

        .comment-text {
            line-height: 1.5;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="lesson-header">
        <h2>Lesson: Web technologies</h2>
        <p style="color: #666;">Learn the fundamentals of Web Dev</p>
    </div>

    <section class="comment-section">
        <h3>Leave a Comment</h3>
        <textarea id="commentInput" placeholder="Share your thoughts, ask questions..."></textarea>
        <button id="postComment" class="btn-comment">Post Comment</button>

        <h3 style="margin-top: 30px;">Comments (<span id="commentCount">0</span>)</h3>
        <div id="commentList"></div>
    </section>

    <script>
        const lessonId = 'lesson_1';
        let currentUser = localStorage.getItem('currentUser') || 'Student_' + Math.floor(Math.random() * 1000);
        localStorage.setItem('currentUser', currentUser);

        function getComments() {
            let comments = localStorage.getItem('comments_' + lessonId);
            return comments ? JSON.parse(comments) : [];
        }

        function saveComments(comments) {
            localStorage.setItem('comments_' + lessonId, JSON.stringify(comments));
        }

        function displayComments() {
            let comments = getComments();
            let commentList = document.getElementById("commentList");
            let commentCount = document.getElementById("commentCount");

            commentCount.innerText = comments.length;

            if (comments.length === 0) {
                commentList.innerHTML = '<p style="text-align: center; color: #999;">No comments yet. Be the first to comment!</p>';
                return;
            }

            let html = '';
            comments.forEach(comment => {
                html += `
                    <div class="comment-box">
                        <div class="comment-meta">
                            <span class="comment-author">👤 ${comment.author}</span>
                            <span class="comment-time">${formatDate(comment.timestamp)}</span>
                        </div>
                        <div class="comment-text">${comment.text}</div>
                        ${comment.userId === currentUser ? 
                            `<button class="delete-btn" onclick="deleteComment(${comment.id})">Delete</button>` 
                            : ''}
                    </div>
                `;
            });

            commentList.innerHTML = html;
        }

        function formatDate(timestamp) {
            let date = new Date(timestamp);
            let now = new Date();
            let diff = now - date;
            let minutes = Math.floor(diff / 60000);
            let hours = Math.floor(diff / 3600000);
            let days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'Just now';
            if (minutes < 60) return minutes + 'm ago';
            if (hours < 24) return hours + 'h ago';
            if (days < 7) return days + 'd ago';
            return date.toLocaleDateString();
        }

        document.getElementById("postComment").addEventListener("click", function() {
            let commentText = document.getElementById("commentInput").value.trim();

            if(commentText === ""){
                alert("Comment cannot be empty!");
                return;
            }

            let comments = getComments();
            let newComment = {
                id: Date.now(),
                text: commentText,
                author: currentUser,
                userId: currentUser,
                timestamp: new Date().toISOString(),
                lessonId: lessonId
            };

            comments.unshift(newComment);
            saveComments(comments);

            document.getElementById("commentInput").value = "";
            displayComments();
        });

        function deleteComment(commentId) {
            if (!confirm('Are you sure you want to delete this comment?')) {
                return;
            }

            let comments = getComments();
            comments = comments.filter(c => c.id !== commentId);
            saveComments(comments);
            displayComments();
        }

        displayComments();
    </script>
</body>
</html>
